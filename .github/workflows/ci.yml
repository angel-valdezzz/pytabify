name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate package metadata
        run: poetry check --strict

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy src/pytabify

      - name: Import Linter
        run: poetry run lint-imports

      - name: Run tests
        run: poetry run pytest

      - name: Build documentation strictly
        run: poetry run python scripts/build_docs.py

      - name: Set up Node for Libdoc UI verification
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify native bilingual Libdoc menu
        run: |
          npm install --prefix build/libdoc-ui jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$PWD/build/libdoc-ui/node_modules" node scripts/verify_libdoc_ui.cjs keywords/index.html

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Deploy documentation to GitHub Pages
        run: |
          poetry run python scripts/build_docs.py
          poetry run ghp-import -n -p -f site
